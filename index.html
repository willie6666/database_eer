<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EER 模型視覺化工具</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0f4fb;
            --bg-surface: #ffffff;
            --bg-elevated: #eef1f8;
            --bg-input: #f8fafc;
            --border: #dde3f0;
            --border-focus: #2563eb;
            --text: #1e2340;
            --text-dim: #6b7280;
            --text-bright: #0f172a;
            --accent: #2563eb;
            --accent-light: #eff6ff;

            --entity-fill: #dbeafe;
            --entity-stroke: #2563eb;
            --weak-entity-fill: #ede9fe;
            --weak-entity-stroke: #7c3aed;
            --rel-fill: #fef3c7;
            --rel-stroke: #b45309;
            --attr-fill: #f8fafc;
            --attr-stroke: #94a3b8;
            --pk-fill: #eff6ff;
            --pk-stroke: #3b82f6;
            --fk-fill: #f0fdf4;
            --fk-stroke: #16a34a;

            --success: #16a34a;
            --error: #dc2626;
            --warning: #d97706;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .app-shell {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ===== Editor Panel ===== */
        .editor-panel {
            width: 400px;
            min-width: 300px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 16px rgba(30,35,64,0.07);
        }
        .editor-panel.collapsed { margin-left: -400px; }

        .editor-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .editor-header .logo {
            width: 30px; height: 30px;
            background: var(--accent);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.03em;
            flex-shrink: 0;
        }
        .editor-header h1 {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.01em;
        }
        .editor-header .badge {
            margin-left: auto;
            font-size: 10px;
            font-weight: 600;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 99px;
            letter-spacing: 0.02em;
            border: 1px solid #bfdbfe;
            white-space: nowrap;
        }

        .editor-toolbar {
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-elevated);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover { border-color: var(--border-focus); color: var(--text-bright); background: #e5eaf6; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
        .btn.danger { border-color: #fca5a5; color: var(--error); }
        .btn.danger:hover { background: #fef2f2; border-color: #f87171; }

        .editor-body {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .editor-body textarea {
            flex: 1;
            width: 100%;
            background: var(--bg-input);
            color: var(--text);
            border: none;
            padding: 14px 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            line-height: 1.8;
            resize: none;
            outline: none;
            tab-size: 4;
        }
        .editor-body textarea::placeholder { color: #b0b8cc; }

        .editor-status {
            padding: 7px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
            min-height: 32px;
        }
        .editor-status .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
        .editor-status.ok { color: var(--success); }
        .editor-status.ok .dot { background: var(--success); }
        .editor-status.err { color: var(--error); }
        .editor-status.err .dot { background: var(--error); }
        .editor-status.idle { color: var(--text-dim); }
        .editor-status.idle .dot { background: var(--text-dim); }

        /* ===== Canvas Area ===== */
        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #edf1f8;
            background-image:
                linear-gradient(rgba(180,195,225,0.45) 1px, transparent 1px),
                linear-gradient(90deg, rgba(180,195,225,0.45) 1px, transparent 1px);
            background-size: 28px 28px;
        }
        .canvas-area svg { width: 100%; height: 100%; cursor: grab; }
        .canvas-area svg:active { cursor: grabbing; }

        /* Toggle button */
        .toggle-editor {
            position: absolute;
            left: 0; top: 16px;
            width: 22px; height: 46px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-left: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px;
            color: var(--text-dim);
            z-index: 15;
            transition: all 0.2s;
            box-shadow: 2px 0 6px rgba(30,35,64,0.07);
        }
        .toggle-editor:hover { color: var(--text-bright); background: var(--bg-elevated); }

        /* HUD */
        .canvas-hud {
            position: absolute;
            bottom: 16px; right: 16px;
            display: flex; gap: 4px; z-index: 10;
        }
        .hud-btn {
            width: 34px; height: 34px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text-dim);
            font-size: 15px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            box-shadow: 0 1px 4px rgba(30,35,64,0.09);
        }
        .hud-btn:hover { border-color: var(--border-focus); color: var(--accent); }

        /* Stats overlay */
        .stats-overlay {
            position: absolute;
            top: 14px; right: 14px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 10px 18px;
            font-size: 11px;
            color: var(--text-dim);
            z-index: 10;
            display: flex; gap: 20px;
            box-shadow: 0 2px 10px rgba(30,35,64,0.08);
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
        .stat-val {
            font-size: 22px; font-weight: 700;
            color: var(--text-bright);
            font-family: 'IBM Plex Mono', monospace;
            line-height: 1;
        }


        /* SVG node styles */
        .node-label {
            text-anchor: middle;
            dominant-baseline: central;
            font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif;
            font-size: 13px;
            font-weight: 700;
            fill: #1e2340;
            pointer-events: none;
        }
        .node-label.weak { fill: #5b21b6; }
        .attr-label {
            text-anchor: middle;
            dominant-baseline: central;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            fill: #374151;
            pointer-events: none;
        }
        .pk-label { fill: #1d4ed8; font-weight: 700; }
        .fk-label { fill: #166534; font-style: italic; }
        .rel-label {
            text-anchor: middle;
            dominant-baseline: central;
            font-family: 'IBM Plex Sans', 'Noto Sans TC', sans-serif;
            font-size: 11px;
            font-weight: 600;
            fill: #78350f;
            pointer-events: none;
        }
        .card-label {
            text-anchor: middle;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            fill: #1e2340;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0bbd4; }
    </style>
</head>
<body>

<div class="app-shell">
    <!-- Editor Panel -->
    <div class="editor-panel" id="editorPanel">
        <div class="editor-header">
            <div class="logo">ER</div>
            <h1>EER 視覺化工具</h1>
            <span class="badge">Chen Notation</span>
        </div>
        <div class="editor-toolbar">
            <button class="btn primary" id="btnRender">▶ 渲染</button>
            <button class="btn danger" id="btnClear">✕ 清空</button>
        </div>
        <div class="editor-body">
            <textarea id="mermaidInput" placeholder="在此貼上 Mermaid erDiagram 語法&#10;&#10;例如：&#10;erDiagram&#10;    USER {&#10;        int user_id PK&#10;        varchar username&#10;    }&#10;    USER ||--o{ ORDER : places" spellcheck="false"></textarea>
        </div>
        <div class="editor-status idle" id="statusBar">
            <div class="dot"></div>
            <span id="statusText">就緒 — 貼上 Mermaid 碼後按「渲染」</span>
        </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-area" id="canvasArea">
        <button class="toggle-editor" id="toggleEditor">◀</button>


        <!-- Stats -->
        <div class="stats-overlay" id="statsBox">
            <div class="stat-item"><span class="stat-val" id="statEntities">0</span>實體</div>
            <div class="stat-item"><span class="stat-val" id="statRelations">0</span>關係</div>
            <div class="stat-item"><span class="stat-val" id="statAttrs">0</span>屬性</div>
        </div>

        <!-- HUD -->
        <div class="canvas-hud">
            <button class="hud-btn" id="btnFit" title="適應螢幕">⊞</button>
            <button class="hud-btn" id="btnUnpin" title="解除圖釘">⊙</button>
            <button class="hud-btn" id="btnZoomIn" title="放大">+</button>
            <button class="hud-btn" id="btnZoomOut" title="縮小">−</button>
        </div>

        <svg id="svgCanvas">
            <defs>
                <filter id="nodeShadow" x="-25%" y="-25%" width="150%" height="150%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e2340" flood-opacity="0.10"/>
                </filter>
                <filter id="nodeHover" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.22"/>
                </filter>
            </defs>
        </svg>
    </div>
</div>

<script>
// ==========================================================
// Mermaid erDiagram Parser
// ==========================================================
function parseMermaidER(code) {
    const entities = {};
    const relationships = [];
    const lines = code.split('\n');
    let currentEntity = null;
    let insideBlock = false;

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line || line.startsWith('%%') || line === 'erDiagram') continue;

        if (!insideBlock) {
            const blockStart = line.match(/^(\w+)\s*\{/);
            if (blockStart) {
                currentEntity = blockStart[1];
                if (!entities[currentEntity]) {
                    entities[currentEntity] = { name: currentEntity, attributes: [] };
                }
                insideBlock = true;
                continue;
            }
        }

        if (insideBlock && line === '}') {
            insideBlock = false;
            currentEntity = null;
            continue;
        }

        if (insideBlock && currentEntity) {
            const attrMatch = line.match(/^(\S+)\s+(\S+)(?:\s+(PK|FK|"[^"]*"))?(?:\s+(PK|FK|"[^"]*"))?(?:\s+("[^"]*"))?/);
            if (attrMatch) {
                const attrType = attrMatch[1];
                const attrName = attrMatch[2];
                let isPK = false, isFK = false, comment = '';
                for (let j = 3; j <= 5; j++) {
                    if (!attrMatch[j]) continue;
                    if (attrMatch[j] === 'PK') isPK = true;
                    else if (attrMatch[j] === 'FK') isFK = true;
                    else if (attrMatch[j].startsWith('"')) comment = attrMatch[j].replace(/"/g, '');
                }
                entities[currentEntity].attributes.push({ name: attrName, type: attrType, isPK, isFK, comment });
            }
            continue;
        }

        const relMatch = line.match(/^(\w+)\s+(\|[|o]|[{}][|o]|\|\|)(--)(\|[|o]|[{}][|o]|\|\||[|o][{}]|[|o]\|)\s+(\w+)\s*:\s*"?([^"]*)"?$/);
        if (relMatch) {
            const src = relMatch[1];
            const leftCard = relMatch[2];
            const rightCard = relMatch[4];
            const tgt = relMatch[5];
            const label = relMatch[6].trim();
            if (!entities[src]) entities[src] = { name: src, attributes: [] };
            if (!entities[tgt]) entities[tgt] = { name: tgt, attributes: [] };

            const parseCard = (token) => {
                let many = false, mandatory = false;
                if (token.includes('{') || token.includes('}')) many = true;
                if (token.includes('||') || (token.includes('|') && !token.includes('o'))) mandatory = true;
                if (token === '||') { many = false; mandatory = true; }
                if (token === 'o|' || token === '|o') { many = false; mandatory = false; }
                if (token === 'o{' || token === '}o') { many = true; mandatory = false; }
                if (token === '|{' || token === '}|') { many = true; mandatory = true; }
                return { many, mandatory };
            };
            const left = parseCard(leftCard);
            const right = parseCard(rightCard);

            relationships.push({
                source: src, target: tgt, label,
                srcCard: left.many ? 'N' : '1',
                tgtCard: right.many ? 'N' : '1',
                srcMandatory: left.mandatory,
                tgtMandatory: right.mandatory,
                isSelfRef: src === tgt
            });
        }
    }

    // Detect weak entities: has attributes but none is PK
    Object.values(entities).forEach(ent => {
        ent.isWeak = ent.attributes.length > 0 && !ent.attributes.some(a => a.isPK);
    });

    // Detect identifying relationships: connected to at least one weak entity
    relationships.forEach(rel => {
        rel.isIdentifying = !!(entities[rel.source]?.isWeak || entities[rel.target]?.isWeak);
    });

    return { entities: Object.values(entities), relationships };
}

// ==========================================================
// D3 Renderer
// ==========================================================
let simulation = null;
let currentZoom = null;

function renderDiagram(parsed) {
    const svg = d3.select('#svgCanvas');
    svg.selectAll('g.root').remove();
    if (simulation) simulation.stop();

    const { entities, relationships } = parsed;
    const nodesData = [];
    const linksData = [];
    const nodeMap = {};
    let totalAttrs = 0;

    // Entity nodes
    entities.forEach(ent => {
        const node = { id: ent.name, type: 'entity', label: ent.name, isWeak: ent.isWeak };
        nodesData.push(node);
        nodeMap[ent.name] = node;

        ent.attributes.forEach(attr => {
            const attrId = `attr__${ent.name}__${attr.name}`;
            const attrType = attr.isPK ? 'pk' : (attr.isFK ? 'fk' : 'attr');
            const attrNode = { id: attrId, type: attrType, label: attr.name, parent: ent.name };
            nodesData.push(attrNode);
            nodeMap[attrId] = attrNode;
            linksData.push({ source: ent.name, target: attrId, linkType: 'attr' });
            totalAttrs++;
        });
    });

    // Relationship nodes + links
    relationships.forEach((rel, idx) => {
        const relId = `rel__${idx}__${rel.label}`;
        const relNode = { id: relId, type: 'rel', label: rel.label, isIdentifying: rel.isIdentifying };
        nodesData.push(relNode);
        nodeMap[relId] = relNode;

        linksData.push({ source: rel.source, target: relId, linkType: 'rel', mandatory: rel.srcMandatory, cardLabel: rel.srcCard });

        if (rel.isSelfRef) {
            const dummyId = `dummy__${idx}`;
            nodesData.push({ id: dummyId, type: 'dummy', label: '' });
            linksData.push({ source: relId, target: dummyId, linkType: 'rel', mandatory: false, cardLabel: '' });
            linksData.push({ source: dummyId, target: rel.target, linkType: 'rel', mandatory: rel.tgtMandatory, cardLabel: rel.tgtCard });
        } else {
            linksData.push({ source: relId, target: rel.target, linkType: 'rel', mandatory: rel.tgtMandatory, cardLabel: rel.tgtCard });
        }
    });

    document.getElementById('statEntities').textContent = entities.length;
    document.getElementById('statRelations').textContent = relationships.length;
    document.getElementById('statAttrs').textContent = totalAttrs;

    const container = document.getElementById('canvasArea');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const g = svg.append('g').attr('class', 'root');

    const zoom = d3.zoom()
        .scaleExtent([0.03, 4])
        .on('zoom', (event) => g.attr('transform', event.transform));
    svg.call(zoom);
    currentZoom = zoom;

    // Force simulation
    simulation = d3.forceSimulation(nodesData)
        .force('link', d3.forceLink(linksData).id(d => d.id).distance(d => {
            if (d.linkType === 'attr') return 55;
            return 130;
        }))
        .force('charge', d3.forceManyBody().strength(d => {
            if (d.type === 'attr' || d.type === 'pk' || d.type === 'fk') return -25;
            if (d.type === 'rel') return -800;
            if (d.type === 'dummy') return -30;
            return -1800;
        }))
        .force('collide', d3.forceCollide().radius(d => {
            if (d.type === 'attr' || d.type === 'pk' || d.type === 'fk') return 26;
            if (d.type === 'dummy') return 5;
            return 65;
        }))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .alphaDecay(0.02);

    // ── Draw links ──────────────────────────────────────────────
    const linkGroup = g.append('g').attr('class', 'links').selectAll('g')
        .data(linksData).enter().append('g');

    // Attribute links (thin gray)
    linkGroup.filter(d => d.linkType === 'attr').append('line')
        .attr('stroke', '#c8d2e6')
        .attr('stroke-width', 1.2)
        .attr('opacity', 0.85);

    // Total participation: double-line (thick base + white gap)
    linkGroup.filter(d => d.linkType === 'rel' && d.mandatory).each(function() {
        d3.select(this).append('line').attr('class', 'link-bg')
            .attr('stroke', '#374151').attr('stroke-width', 5).attr('opacity', 0.9);
        d3.select(this).append('line').attr('class', 'link-fg')
            .attr('stroke', '#edf1f8').attr('stroke-width', 2.2);
    });

    // Partial participation: single line
    linkGroup.filter(d => d.linkType === 'rel' && !d.mandatory).append('line')
        .attr('stroke', '#9ca3af').attr('stroke-width', 1.8).attr('opacity', 0.9);

    // Cardinality labels
    const cardLabels = linkGroup.filter(d => d.cardLabel).append('text')
        .attr('class', 'card-label')
        .text(d => d.cardLabel);

    // ── Draw nodes ──────────────────────────────────────────────
    const nodeGroup = g.append('g').attr('class', 'nodes').selectAll('g')
        .data(nodesData).enter().append('g')
        .call(d3.drag()
            .on('start', (event, d) => {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x; d.fy = d.y;
            })
            .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
            .on('end', (event, d) => {
                if (!event.active) simulation.alphaTarget(0);
            })
        );

    // ── Entity: rectangle (strong) or double-rectangle (weak)
    nodeGroup.filter(d => d.type === 'entity').each(function(d) {
        const w = 132, h = 44;
        const sel = d3.select(this);

        sel.append('rect')
            .attr('width', w).attr('height', h)
            .attr('x', -w/2).attr('y', -h/2).attr('rx', 4)
            .attr('fill', d.isWeak ? '#ede9fe' : '#dbeafe')
            .attr('stroke', d.isWeak ? '#7c3aed' : '#2563eb')
            .attr('stroke-width', 2)
            .attr('filter', 'url(#nodeShadow)');

        // Weak entity: inner border (double rectangle)
        if (d.isWeak) {
            const inset = 5;
            sel.append('rect')
                .attr('width', w - inset*2).attr('height', h - inset*2)
                .attr('x', -w/2 + inset).attr('y', -h/2 + inset).attr('rx', 2)
                .attr('fill', 'none')
                .attr('stroke', '#7c3aed')
                .attr('stroke-width', 1.5);
        }
    });

    // ── Relationship: diamond (regular) or double-diamond (identifying)
    nodeGroup.filter(d => d.type === 'rel').each(function(d) {
        const sel = d3.select(this);

        sel.append('polygon')
            .attr('points', '0,-35 74,0 0,35 -74,0')
            .attr('fill', '#fef3c7')
            .attr('stroke', '#b45309')
            .attr('stroke-width', 2)
            .attr('filter', 'url(#nodeShadow)');

        // Identifying relationship: inner diamond
        if (d.isIdentifying) {
            sel.append('polygon')
                .attr('points', '0,-26 57,0 0,26 -57,0')
                .attr('fill', 'none')
                .attr('stroke', '#b45309')
                .attr('stroke-width', 1.5);
        }
    });

    // ── Regular attribute: plain ellipse
    nodeGroup.filter(d => d.type === 'attr').append('ellipse')
        .attr('rx', 46).attr('ry', 16)
        .attr('fill', '#f8fafc')
        .attr('stroke', '#94a3b8')
        .attr('stroke-width', 1.5);

    // ── PK attribute: ellipse with blue border
    nodeGroup.filter(d => d.type === 'pk').append('ellipse')
        .attr('rx', 48).attr('ry', 17)
        .attr('fill', '#eff6ff')
        .attr('stroke', '#3b82f6')
        .attr('stroke-width', 2);

    // ── FK attribute: dashed ellipse
    nodeGroup.filter(d => d.type === 'fk').append('ellipse')
        .attr('rx', 46).attr('ry', 16)
        .attr('fill', '#f0fdf4')
        .attr('stroke', '#16a34a')
        .attr('stroke-width', 1.5)
        .attr('stroke-dasharray', '5,3');

    // ── Labels
    nodeGroup.filter(d => d.type === 'entity').append('text')
        .attr('class', d => d.isWeak ? 'node-label weak' : 'node-label')
        .text(d => d.label);

    nodeGroup.filter(d => d.type === 'rel').append('text')
        .attr('class', 'rel-label').text(d => d.label);

    nodeGroup.filter(d => d.type === 'attr').append('text')
        .attr('class', 'attr-label').text(d => d.label);

    // PK: underlined
    nodeGroup.filter(d => d.type === 'pk').append('text')
        .attr('class', 'attr-label pk-label')
        .style('text-decoration', 'underline')
        .text(d => d.label);

    // FK: italic
    nodeGroup.filter(d => d.type === 'fk').append('text')
        .attr('class', 'attr-label fk-label')
        .text(d => d.label);

    // ── Hover interactions ───────────────────────────────────────
    const adj = {};
    linksData.forEach(l => {
        const s = typeof l.source === 'object' ? l.source.id : l.source;
        const t = typeof l.target === 'object' ? l.target.id : l.target;
        adj[`${s},${t}`] = true;
        adj[`${t},${s}`] = true;
    });
    function isConn(a, b) { return adj[`${a.id},${b.id}`] || a.id === b.id; }

    nodeGroup.filter(d => d.type === 'entity' || d.type === 'rel')
        .style('cursor', 'pointer')
        .on('mouseover', function(event, d) {
            d3.select(this).select('rect, polygon').attr('filter', 'url(#nodeHover)');
            nodeGroup.style('opacity', o => isConn(d, o) ? 1 : 0.12);
            linkGroup.style('opacity', l => {
                const s = typeof l.source === 'object' ? l.source.id : l.source;
                const t = typeof l.target === 'object' ? l.target.id : l.target;
                return (s === d.id || t === d.id) ? 1 : 0.06;
            });
        })
        .on('mouseout', function() {
            d3.select(this).select('rect, polygon').attr('filter', 'url(#nodeShadow)');
            nodeGroup.style('opacity', 1);
            linkGroup.style('opacity', 1);
        });

    // ── Tick ──────────────────────────────────────────────────────
    simulation.on('tick', () => {
        linkGroup.selectAll('line')
            .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);

        cardLabels
            .attr('x', d => d.source.x * 0.6 + d.target.x * 0.4)
            .attr('y', d => d.source.y * 0.6 + d.target.y * 0.4 - 11);

        nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    setTimeout(() => fitToScreen(svg, zoom, width, height), 1200);
}

function fitToScreen(svg, zoom, width, height) {
    if (!svg || !zoom) return;
    svg.transition().duration(800).call(
        zoom.transform,
        d3.zoomIdentity.translate(width / 2, height / 2).scale(0.15).translate(-width / 2, -height / 2)
    );
}

// ==========================================================
// UI Wiring
// ==========================================================
const textarea = document.getElementById('mermaidInput');
const statusBar = document.getElementById('statusBar');
const statusText = document.getElementById('statusText');

function setStatus(type, msg) {
    statusBar.className = 'editor-status ' + type;
    statusText.textContent = msg;
}

function doRender() {
    const code = textarea.value.trim();
    if (!code) { setStatus('err', '請輸入 Mermaid erDiagram 語法'); return; }
    try {
        const parsed = parseMermaidER(code);
        if (parsed.entities.length === 0) { setStatus('err', '未偵測到任何實體，請確認語法正確'); return; }
        renderDiagram(parsed);
        const weakCount = parsed.entities.filter(e => e.isWeak).length;
        setStatus('ok', `成功渲染 ${parsed.entities.length} 個實體（${weakCount} 弱）、${parsed.relationships.length} 條關係`);
    } catch(e) {
        setStatus('err', '解析錯誤：' + e.message);
        console.error(e);
    }
}

document.getElementById('btnRender').addEventListener('click', doRender);

textarea.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doRender(); }
    if (e.key === 'Tab') {
        e.preventDefault();
        const start = textarea.selectionStart, end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + '    ' + textarea.value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + 4;
    }
});

document.getElementById('btnClear').addEventListener('click', () => {
    textarea.value = '';
    d3.select('#svgCanvas').selectAll('g.root').remove();
    if (simulation) simulation.stop();
    document.getElementById('statEntities').textContent = '0';
    document.getElementById('statRelations').textContent = '0';
    document.getElementById('statAttrs').textContent = '0';
    setStatus('idle', '已清空');
});

document.getElementById('toggleEditor').addEventListener('click', () => {
    const panel = document.getElementById('editorPanel');
    panel.classList.toggle('collapsed');
    document.getElementById('toggleEditor').textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
});

document.getElementById('btnFit').addEventListener('click', () => {
    const container = document.getElementById('canvasArea');
    if (currentZoom) fitToScreen(d3.select('#svgCanvas'), currentZoom, container.clientWidth, container.clientHeight);
});

document.getElementById('btnUnpin').addEventListener('click', () => {
    if (!simulation) return;
    simulation.nodes().forEach(d => { d.fx = null; d.fy = null; });
    simulation.alpha(0.8).restart();
});

document.getElementById('btnZoomIn').addEventListener('click', () => {
    if (currentZoom) d3.select('#svgCanvas').transition().duration(300).call(currentZoom.scaleBy, 1.5);
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
    if (currentZoom) d3.select('#svgCanvas').transition().duration(300).call(currentZoom.scaleBy, 0.67);
});
